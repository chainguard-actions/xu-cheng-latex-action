name: Test conflicting LuaLaTeX and XeLaTeX options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" /tmp/fake-bin/docker
          chmod +x /tmp/fake-bin/docker
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run action with both lualatex and xelatex (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          root_file: test.tex
          working_directory: tests/fixtures
          latexmk_use_lualatex: "true"
          latexmk_use_xelatex: "true"

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when both lualatex and xelatex are enabled"
            exit 1
          fi
          echo "PASS: action correctly failed with conflicting engine options"
