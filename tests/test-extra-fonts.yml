name: Test extra_fonts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker/docker" "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create a dummy font file for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fonts"
          # Create a minimal dummy .ttf file (just needs to exist as a file)
          printf '\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00' \
            > "$GITHUB_WORKSPACE/tests/fixtures/fonts/dummy.ttf"
          echo "Created dummy font file"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/fonts/"
      - name: Compile LaTeX with extra_fonts
        id: action
        uses: .
        with:
          root_file: tests/fixtures/basic/main.tex
          extra_fonts: tests/fixtures/fonts/dummy.ttf
      - name: Assert PDF was produced
        run: |
          echo "Checking for output PDF..."
          if [ ! -f "tests/fixtures/basic/main.pdf" ]; then
            echo "FAIL: expected PDF file tests/fixtures/basic/main.pdf not found"
            ls -la tests/fixtures/basic/ || true
            exit 1
          fi
          echo "PASS: PDF file was produced with extra_fonts set"
