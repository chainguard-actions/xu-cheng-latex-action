name: Test LaTeX compilation with Debian OS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'echo "Mock docker called: $*"' 'exit 0' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile LaTeX document using Debian-based image
        id: action
        uses: .
        with:
          root_file: pristine/xu-cheng--latex-action/4.0.0/test/test.tex
          os: debian
      - name: Assert action succeeded with Debian image
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with Debian OS"
            exit 1
          fi
          echo "PASS: action completed successfully with Debian image"
