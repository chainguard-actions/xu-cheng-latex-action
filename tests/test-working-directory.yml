name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with a LaTeX file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/subdir"
          cp "$GITHUB_WORKSPACE/tests/fixtures/simple.tex" "$GITHUB_WORKSPACE/tests/fixtures/subdir/simple.tex"
      - name: Set up mock docker
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/docker <<'MOCKEOF'
          #!/bin/bash
          # Mock docker: INPUT_* vars are already in environment via -e flags
          # Verify working_directory is passed through
          if [ -z "$INPUT_WORKING_DIRECTORY" ]; then
            echo "::error :: INPUT_WORKING_DIRECTORY is not set"
            exit 1
          fi
          echo "WORKING_DIRECTORY_VALUE=$INPUT_WORKING_DIRECTORY" >> "$GITHUB_ENV"
          # Simulate compilation relative to working directory
          readarray -t root_files <<< "$INPUT_ROOT_FILE"
          for f in "${root_files[@]}"; do
            [ -z "$f" ] && continue
            pdf_path="${f%.tex}.pdf"
            echo "Simulated PDF: $f -> $pdf_path"
            # Create the PDF relative to the working directory
            touch "$INPUT_WORKING_DIRECTORY/$pdf_path"
          done
          exit 0
          MOCKEOF
          chmod +x /tmp/mock-bin/docker
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"
      - name: Compile with working_directory
        id: action
        uses: .
        with:
          root_file: simple.tex
          working_directory: tests/fixtures/subdir
      - name: Assert working_directory was passed to docker
        run: |
          echo "actual: $WORKING_DIRECTORY_VALUE"
          if [ "$WORKING_DIRECTORY_VALUE" != "tests/fixtures/subdir" ]; then
            echo "FAIL: expected working_directory to be 'tests/fixtures/subdir', got '$WORKING_DIRECTORY_VALUE'"
            exit 1
          fi
          echo "PASS: working_directory was correctly passed to docker"
      - name: Assert PDF was created in working directory
        run: |
          echo "Checking for PDF at: $GITHUB_WORKSPACE/tests/fixtures/subdir/simple.pdf"
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/subdir/simple.pdf" ]; then
            echo "FAIL: expected simple.pdf to be created in working directory"
            exit 1
          fi
          echo "PASS: simple.pdf was created in the working directory"
