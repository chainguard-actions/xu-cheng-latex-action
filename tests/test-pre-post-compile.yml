name: Test pre_compile and post_compile inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/usr/bin/env bash' \
            'echo "INPUT_PRE_COMPILE=$INPUT_PRE_COMPILE"' \
            'echo "INPUT_POST_COMPILE=$INPUT_POST_COMPILE"' \
            'exit 0' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile with pre and post compile hooks
        id: action
        uses: .
        with:
          root_file: main.tex
          pre_compile: "echo pre-compile-hook"
          post_compile: "echo post-compile-hook"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed"
            exit 1
          fi
          echo "PASS: action completed successfully with pre/post compile hooks"
