name: Test pre_compile and post_compile hooks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker/docker" "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile with pre and post compile hooks
        id: action
        uses: .
        with:
          root_file: tests/fixtures/hooks/doc.tex
          pre_compile: |
            echo "pre-compile-marker" > /tmp/pre_compile_ran.txt
          post_compile: |
            echo "post-compile-marker" > /tmp/post_compile_ran.txt
      - name: Assert PDF was produced
        run: |
          echo "Checking for output PDF..."
          if [ ! -f "tests/fixtures/hooks/doc.pdf" ]; then
            echo "FAIL: expected PDF file tests/fixtures/hooks/doc.pdf not found"
            ls -la tests/fixtures/hooks/ || true
            exit 1
          fi
          echo "PASS: PDF file was produced with pre/post compile hooks"
