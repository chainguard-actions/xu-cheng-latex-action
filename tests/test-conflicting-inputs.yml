name: Test conflicting texlive_version and docker_image inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with conflicting inputs (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          root_file: test.tex
          working_directory: tests/fixtures
          texlive_version: "2024"
          docker_image: ghcr.io/xu-cheng/texlive-alpine:latest

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when both texlive_version and docker_image are set"
            exit 1
          fi
          echo "PASS: action correctly failed with conflicting inputs"
