name: Test invalid inputs - texlive_version and docker_image cannot co-exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to use both texlive_version and docker_image
        id: action
        uses: .
        continue-on-error: true
        with:
          root_file: pristine/xu-cheng--latex-action/3.3.0/tests/fixtures/minimal.tex
          texlive_version: "2024"
          docker_image: "ghcr.io/xu-cheng/texlive-full:20250301"

      - name: Assert action failed due to conflicting inputs
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both texlive_version and docker_image are set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when both texlive_version and docker_image were specified"
