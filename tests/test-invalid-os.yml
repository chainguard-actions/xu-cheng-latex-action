name: Test invalid OS input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid OS (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          root_file: test.tex
          working_directory: tests/fixtures
          os: windows

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid OS input"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid OS input"
