name: Test invalid OS input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid OS (should fail)
        id: action
        uses: .
        with:
          root_file: tests/fixtures/simple.tex
          os: windows
        continue-on-error: true
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid OS input, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid OS input"
