name: Test extra_system_packages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/usr/bin/env bash' \
            'echo "INPUT_EXTRA_SYSTEM_PACKAGES=$INPUT_EXTRA_SYSTEM_PACKAGES"' \
            'exit 0' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile with extra system packages
        id: action
        uses: .
        with:
          root_file: main.tex
          extra_system_packages: "inkscape ghostscript"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed"
            exit 1
          fi
          echo "PASS: action completed successfully with extra system packages"
