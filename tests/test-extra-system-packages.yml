name: Test extra_system_packages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock docker
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/docker <<'MOCKEOF'
          #!/bin/bash
          # Mock docker: INPUT_* vars are already in environment via -e flags
          # Verify extra_system_packages is passed through
          if [ -z "$INPUT_EXTRA_SYSTEM_PACKAGES" ]; then
            echo "::error :: INPUT_EXTRA_SYSTEM_PACKAGES is not set"
            exit 1
          fi
          echo "EXTRA_SYSTEM_PACKAGES_VALUE=$INPUT_EXTRA_SYSTEM_PACKAGES" >> "$GITHUB_ENV"
          # Simulate compilation
          readarray -t root_files <<< "$INPUT_ROOT_FILE"
          for f in "${root_files[@]}"; do
            [ -z "$f" ] && continue
            pdf_path="${f%.tex}.pdf"
            echo "Simulated PDF: $f -> $pdf_path"
            touch "$pdf_path"
          done
          exit 0
          MOCKEOF
          chmod +x /tmp/mock-bin/docker
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"
      - name: Compile with extra_system_packages
        id: action
        uses: .
        with:
          root_file: tests/fixtures/simple.tex
          extra_system_packages: "curl wget"
      - name: Assert extra_system_packages was passed to docker
        run: |
          echo "actual: $EXTRA_SYSTEM_PACKAGES_VALUE"
          if [ "$EXTRA_SYSTEM_PACKAGES_VALUE" != "curl wget" ]; then
            echo "FAIL: expected extra_system_packages to be 'curl wget', got '$EXTRA_SYSTEM_PACKAGES_VALUE'"
            exit 1
          fi
          echo "PASS: extra_system_packages was correctly passed to docker"
      - name: Assert PDF was created
        run: |
          echo "Checking for PDF at: $GITHUB_WORKSPACE/tests/fixtures/simple.pdf"
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/simple.pdf" ]; then
            echo "FAIL: expected simple.pdf to be created"
            exit 1
          fi
          echo "PASS: simple.pdf was created"
