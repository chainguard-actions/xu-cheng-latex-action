name: Test error on invalid OS input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid OS (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          root_file: tests/fixtures/minimal.tex
          os: ubuntu
      - name: Assert action failed due to invalid OS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when os is not 'alpine' or 'debian'"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid OS input"
