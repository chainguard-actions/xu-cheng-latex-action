name: Test basic LaTeX compilation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" /tmp/fake-bin/docker
          chmod +x /tmp/fake-bin/docker
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Compile LaTeX document
        uses: .
        with:
          root_file: test.tex
          working_directory: tests/fixtures

      - name: Assert PDF was produced
        run: |
          echo "Checking for PDF output..."
          if [ ! -f "tests/fixtures/test.pdf" ]; then
            echo "FAIL: expected tests/fixtures/test.pdf to be produced"
            exit 1
          fi
          echo "PASS: PDF was produced at tests/fixtures/test.pdf"
