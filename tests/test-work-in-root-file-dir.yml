name: Test work_in_root_file_dir option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock docker
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/docker <<'MOCKEOF'
          #!/bin/bash
          # Mock docker: INPUT_* vars are already in environment via -e flags
          if [ -n "$INPUT_PRE_COMPILE" ]; then eval "$INPUT_PRE_COMPILE"; fi
          readarray -t root_files <<< "$INPUT_ROOT_FILE"
          exit_code=0
          for f in "${root_files[@]}"; do
            [ -z "$f" ] && continue
            if [ "$INPUT_WORK_IN_ROOT_FILE_DIR" = "true" ]; then
              pdf_path="$(dirname "$f")/$(basename "${f%.tex}").pdf"
            else
              pdf_path="${f%.tex}.pdf"
            fi
            if [[ "$f" == *"broken"* ]]; then
              echo "::error :: LaTeX compilation failed for $f"
              if [ "$INPUT_CONTINUE_ON_ERROR" = "true" ]; then exit_code=1; else exit 1; fi
            else
              echo "Simulated PDF: $f -> $pdf_path"
              touch "$pdf_path"
            fi
          done
          if [ -n "$INPUT_POST_COMPILE" ]; then eval "$INPUT_POST_COMPILE"; fi
          exit $exit_code
          MOCKEOF
          chmod +x /tmp/mock-bin/docker
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"
      - name: Compile with work_in_root_file_dir enabled
        id: action
        uses: .
        with:
          root_file: tests/fixtures/simple.tex
          work_in_root_file_dir: "true"
      - name: Assert PDF was created in the same directory as the source
        run: |
          echo "Checking for PDF at: $GITHUB_WORKSPACE/tests/fixtures/simple.pdf"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/" || true
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/simple.pdf" ]; then
            echo "FAIL: expected simple.pdf to be created in tests/fixtures/"
            exit 1
          fi
          echo "PASS: simple.pdf was created in the root file's directory"
