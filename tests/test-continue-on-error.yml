name: Test continue_on_error with broken LaTeX
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker/docker" "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile broken LaTeX document with continue_on_error
        id: action
        uses: .
        continue-on-error: true
        with:
          root_file: tests/fixtures/error/broken.tex
          continue_on_error: "true"
      - name: Assert step did not fail the workflow (continue_on_error worked)
        run: |
          echo "PASS: action completed without failing the workflow (continue_on_error=true)"
