name: Test that compilation error causes action failure by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check if running under act (skip compilation in act environment)
        id: env-check
        run: |
          if [ "${ACT}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Running under act — skipping LaTeX compilation (requires large Docker image)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile invalid LaTeX document (expect failure)
        id: action
        if: steps.env-check.outputs.skip != 'true'
        uses: .
        continue-on-error: true
        with:
          root_file: tests/fixtures/invalid.tex
      - name: Assert action failed due to LaTeX compilation error
        if: steps.env-check.outputs.skip != 'true'
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when compiling invalid LaTeX"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid LaTeX document"
      - name: Skip notice when running under act
        if: steps.env-check.outputs.skip == 'true'
        run: |
          echo "SKIP: Running under act — LaTeX compilation requires a large Docker image not available in this environment"
