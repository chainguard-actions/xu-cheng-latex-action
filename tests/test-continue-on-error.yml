name: Test continue_on_error with multiple files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" /tmp/fake-bin/docker
          chmod +x /tmp/fake-bin/docker
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Create test LaTeX files
        run: |
          mkdir -p tests/fixtures/multi
          cat > tests/fixtures/multi/good.tex << 'EOF'
          \documentclass{article}
          \begin{document}
          Good document.
          \end{document}
          EOF
          cat > tests/fixtures/multi/bad.tex << 'EOF'
          \documentclass{article}
          \begin{document}
          \badcommand
          \end{document}
          EOF

      - name: Run action with continue_on_error (should not abort on bad file)
        id: action
        uses: .
        continue-on-error: true
        with:
          root_file: |
            good.tex
            bad.tex
          working_directory: tests/fixtures/multi
          continue_on_error: "true"

      - name: Assert action failed (bad.tex causes failure) but good.pdf was produced
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail overall because bad.tex fails
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to bad.tex"
            exit 1
          fi
          # But good.pdf should have been produced because continue_on_error=true
          if [ ! -f "tests/fixtures/multi/good.pdf" ]; then
            echo "FAIL: expected good.pdf to be produced even though bad.tex failed"
            exit 1
          fi
          echo "PASS: continue_on_error allowed good.tex to compile despite bad.tex failure"
